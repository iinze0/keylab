<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keylab</title>
<link rel="icon" href="logo.svg">
<style>
  :root {
    --bg: #0e0e11;
    --panel: #16161a;
    --card: #1e1e24;
    --border: #2a2a32;
    --text: #f0f0f4;
    --dim: #9a9aa8;
    --accent: #f5c518;
    --selected: #6c5ce7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px 24px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header img { width: 36px; height: 36px; border-radius: 8px; }
  header h1 { font-size: 20px; font-weight: 700; }
  header h1 span { color: var(--accent); }
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px;
  }
  .hero img { width: 120px; height: 120px; border-radius: 24px; margin-bottom: 20px; }
  .hero h2 { font-size: 36px; font-weight: 700; margin-bottom: 8px; }
  .hero h2 span { color: var(--accent); }
  .hero p { color: var(--dim); font-size: 16px; max-width: 420px; margin-bottom: 28px; }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    padding: 12px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .btn:hover { background: #ffd84d; }
  .note { margin-top: 20px; font-size: 13px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <img src="logo.svg" alt="Keylab">
  <h1>Key<span>lab</span></h1>
</header>

<div class="hero">
  <img src="logo.svg" alt="Keylab logo">
  <h2>Key<span>lab</span></h2>
  <p>Configure your ROYUAN keyboard. Remap keys, set RGB, adjust actuation and Rapid Trigger.</p>
  <a class="btn" href="https://app.getsharkfin.com/">Open Configurator</a>
  <div class="note">Keylab — keyboard configuration</div>
</div>
</body>
</html>
